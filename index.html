<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B2FF7">
<meta name="description" content="تطبيق مهام مبني على التقويم التربوي للعام الدراسي 2026/2027 - التعليم العام، دولة الكويت.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مهام التقويم">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="./config.js"></script>
<script src="./supabase.min.js" defer></script>
</head>
<body>
<title>مهام التقويم التربوي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --violet:#7B2FF7;
  --violet-2:#9D4EFF;
  --rose:#FF4D9D;
  --bg:#FBF7FF;
  --surface:#FFFFFF;
  --surface-2:#F0E8FF;
  --ink:#2A2138;
  --ink-soft:#6E6285;
  --line:#E4D8FA;
  --line-soft:#F0E9FB;
  --c-dawam:#7B2FF7;
  --c-imtihan:#E11D2E;
  --c-nataij:#1668E3;
  --c-tasjeel:#EA7317;
  --c-otla:#0F9D58;
  --c-munasaba:#D6217E;
  --c-hissa:#C2410C;
  --on-hissa:#FFFFFF;
  --on-violet:#FFFFFF;
  --grad:linear-gradient(135deg,#7B2FF7 0%,#B32FE0 55%,#FF4D9D 100%);
  --shadow:0 1px 2px rgba(90,40,160,.06), 0 8px 24px rgba(90,40,160,.09);
  --shadow-lift:0 8px 34px rgba(70,20,140,.26);
  --r:14px;
  --font-d:"Noto Kufi Arabic",system-ui,sans-serif;
  --font-b:"Noto Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --violet:#B98BFF;
    --violet-2:#CBA5FF;
    --rose:#FF7DBB;
    --bg:#150F22;
    --surface:#1F1733;
    --surface-2:#2C2049;
    --ink:#F1EAFF;
    --ink-soft:#A99BC6;
    --line:#3D2E60;
    --line-soft:#2E2350;
    --c-dawam:#B98BFF;
    --c-imtihan:#FF5C6E;
    --c-nataij:#5FA8FF;
    --c-tasjeel:#FFA24D;
    --c-otla:#3EDC8A;
    --c-munasaba:#EE6FE0;
    --c-hissa:#FFA24D;
    --on-hissa:#2A1503;
    --on-violet:#180F2B;
    --grad:linear-gradient(135deg,#B98BFF 0%,#D97BF0 55%,#FF7DBB 100%);
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 8px 24px rgba(0,0,0,.3);
    --shadow-lift:0 8px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --violet:#B98BFF;
  --violet-2:#CBA5FF;
  --rose:#FF7DBB;
  --bg:#150F22;
  --surface:#1F1733;
  --surface-2:#2C2049;
  --ink:#F1EAFF;
  --ink-soft:#A99BC6;
  --line:#3D2E60;
  --line-soft:#2E2350;
  --c-dawam:#B98BFF;
  --c-imtihan:#FF5C6E;
  --c-nataij:#5FA8FF;
  --c-tasjeel:#FFA24D;
  --c-otla:#3EDC8A;
  --c-munasaba:#EE6FE0;
  --c-hissa:#FFA24D;
  --on-hissa:#2A1503;
  --on-violet:#180F2B;
  --grad:linear-gradient(135deg,#B98BFF 0%,#D97BF0 55%,#FF7DBB 100%);
  --shadow:0 1px 2px rgba(0,0,0,.34), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lift:0 8px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  overscroll-behavior-y:none;
}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-b);font-size:15px;line-height:1.6;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  overscroll-behavior-y:none;
  touch-action:manipulation;              /* يمنع تكبير الصفحة عند النقر المزدوج */
  -webkit-tap-highlight-color:transparent;
  overflow-x:clip;
}
button,.tab,.opt,.chk,.mini,.navbtn{touch-action:manipulation}
h1,h2,h3,h4,.dsp{font-family:var(--font-d);font-weight:600;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

#shell{max-width:560px;margin:0 auto;padding:0 16px 96px;min-height:100vh;min-height:100dvh}
main{contain:layout paint}

/* ---------- app bar ---------- */
.appbar{
  position:sticky;top:0;z-index:30;background:var(--bg);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  padding-block:14px 10px;border-bottom:1px solid var(--line-soft);
  margin-inline:-16px;padding-inline:16px;
}
.appbar-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.brand h1{
  font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand span{font-size:11.5px;color:var(--ink-soft)}
.sync{
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  font-size:10.5px;color:var(--ink-soft);background:var(--surface-2);
  border-radius:999px;padding:5px 9px;white-space:nowrap;
}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);display:block}
.sync.ok i{background:var(--c-otla)}
.sync.local i{background:var(--c-tasjeel)}
.sync.wait i{background:var(--c-imtihan)}
.sync{border:0;cursor:pointer}
.themebtn{
  flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;font-size:15px;
}

/* ---------- month nav ---------- */
.monthnav{display:flex;align-items:center;gap:8px;margin-top:12px}
.navbtn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;color:var(--violet);
  font-size:16px;line-height:1;transition:background .15s;
}
.navbtn:hover:not(:disabled){background:var(--surface-2)}
.navbtn:disabled{opacity:.32;cursor:default}
.monthlabel{flex:1;text-align:center;font-family:var(--font-d);font-weight:600;font-size:16px}
.monthlabel small{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);font-family:var(--font-b)}

.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px;margin-top:12px}
.seg button{
  flex:1;border:0;background:transparent;border-radius:8px;padding:7px 0;
  font-size:13px;font-family:var(--font-d);color:var(--ink-soft);transition:.15s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--violet);box-shadow:var(--shadow)}

/* ---------- calendar grid ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wkh{font-size:10.5px;color:var(--ink-soft);text-align:center;font-family:var(--font-d);padding-bottom:2px}
.wkh.off{color:var(--rose)}
.cell{
  position:relative;aspect-ratio:1/1.06;border-radius:10px;border:1px solid transparent;
  background:var(--surface);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:2px;min-width:0;
}
.cell.blank{background:transparent}
.cell.off{background:var(--surface-2)}
.cell .d{font-size:14px;font-weight:500;line-height:1}
.cell.muted .d{color:var(--ink-soft);opacity:.5}
.cell.today{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}
.cell.today .d{color:var(--violet);font-weight:700}
.cell.sel{background:var(--grad);border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--violet) 42%,transparent)}
.cell.sel .d{color:var(--on-violet)}
.cell.holiday .d{color:var(--c-otla)}
.cell.sel.holiday .d{color:var(--on-violet)}
.dots{display:flex;gap:2.5px;height:8px;align-items:center}
.dots i{width:4.5px;height:4.5px;border-radius:50%;display:block}
.dots i.mine{width:8px;height:8px;border-radius:1.5px;background:var(--grad);transform:rotate(45deg);margin-inline:1px}
.cell.sel .dots i.mine{background:var(--on-violet)!important;opacity:.9}
.cell.sel .dots i{background:var(--on-violet)!important;opacity:.85}
.cell .flag{position:absolute;inset-block-start:3px;inset-inline-end:4px;width:5px;height:5px;border-radius:50%;background:var(--rose)}

/* ---------- day panel ---------- */
.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--line-soft)}
.panel-head .dt{flex:1;min-width:0}
.panel-head h3{font-size:15px}
.panel-head .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.addbtn{
  flex-shrink:0;border:0;background:var(--grad);color:var(--on-violet);border-radius:10px;
  padding:8px 13px;font-size:12.5px;font-family:var(--font-d);font-weight:600;
  display:inline-flex;align-items:center;gap:5px;
  box-shadow:0 3px 12px color-mix(in srgb,var(--violet) 38%,transparent);
}
.panel-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px}
.grp-t{font-size:11px;font-family:var(--font-d);color:var(--ink-soft);letter-spacing:.04em;margin-bottom:7px}

.ev{display:flex;gap:9px;align-items:flex-start;padding:8px 0}
.ev+.ev{border-top:1px solid var(--line-soft)}
.ev .stripe{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0;min-height:20px}
.ev .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.55}
.ev .tag{font-size:10.5px;font-family:var(--font-d);color:var(--ink-soft);margin-top:2px;display:block}
.ev .del{
  flex-shrink:0;border:0;background:transparent;color:var(--ink-soft);
  width:26px;height:26px;border-radius:8px;font-size:15px;line-height:1;padding:0;
}
.ev .del:hover{background:color-mix(in srgb,var(--c-imtihan) 14%,transparent);color:var(--c-imtihan)}

/* ---------- تأكيد ---------- */
.confirm{max-width:420px}
.confirm p{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 4px}
.confirm .what{
  font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:11px;
  padding:11px 12px;margin:12px 0 2px;line-height:1.6;
}
.btn.del{background:var(--c-imtihan);color:#fff}

.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.task+.task{border-top:1px solid var(--line-soft)}
.chk{
  flex-shrink:0;width:21px;height:21px;border-radius:7px;border:1.8px solid var(--line);
  background:var(--surface);display:grid;place-items:center;margin-top:1px;
  font-size:12px;color:transparent;transition:.15s;
}
.chk[aria-checked="true"]{background:var(--grad);border-color:transparent;color:var(--on-violet)}
.task .body{flex:1;min-width:0}
.task .ttl{font-size:14px;font-weight:500;line-height:1.5;word-wrap:break-word}
.task.done .ttl{text-decoration:line-through;color:var(--ink-soft)}
.task .note{font-size:12.5px;color:var(--ink-soft);margin-top:3px;word-wrap:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pill{font-size:10.5px;font-family:var(--font-d);padding:2.5px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
.pill i{width:6px;height:6px;border-radius:50%;display:block}
.pill.p-high{background:color-mix(in srgb,var(--c-imtihan) 14%,transparent);color:var(--c-imtihan)}
.pill.p-mid{background:var(--surface-2);color:var(--ink-soft)}
.pill.late{background:color-mix(in srgb,var(--c-imtihan) 16%,transparent);color:var(--c-imtihan)}
.iconbtn{border:0;background:transparent;color:var(--ink-soft);padding:5px;border-radius:8px;line-height:0;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.empty{font-size:13px;color:var(--ink-soft);text-align:center;padding:16px 8px;line-height:1.7}

/* ---------- week list ---------- */
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-top:10px}
.daycard.is-today{border-color:var(--violet)}
.daycard-h{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.daycard-h .dn{font-family:var(--font-d);font-weight:700;font-size:19px;color:var(--violet);line-height:1}
.daycard-h .dw{font-size:12.5px;color:var(--ink-soft);flex:1}
.daycard-h .mini{border:0;background:var(--surface-2);border-radius:9px;padding:5px 10px;font-size:11.5px;font-family:var(--font-d);color:var(--violet)}

/* ---------- filters ---------- */
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;padding-block:2px 4px;margin-top:12px;scrollbar-width:none;
  margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 12px;font-size:12px;font-family:var(--font-d);color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:6px;
}
.chip i{width:7px;height:7px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--on-violet)}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
.tile .v{font-family:var(--font-d);font-weight:700;font-size:26px;line-height:1.1;color:var(--violet)}
.tile .k{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.tile.warn .v{color:var(--c-imtihan)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-top:12px}
.card h3{font-size:14px;margin-bottom:12px}
.bar{margin-bottom:11px}
.bar:last-child{margin-bottom:0}
.bar .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;gap:8px}
.bar .l b{font-family:var(--font-d);font-weight:600}
.track{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .4s ease}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{flex-shrink:0}
.ring .rt{font-family:var(--font-d);font-weight:700;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring .rs{font-size:12px;color:var(--ink-soft);line-height:1.6}

/* ---------- bottom tabs ---------- */
.tabs{
  position:fixed;inset-inline:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -1px 0 var(--line-soft);
  display:flex;padding:7px 12px calc(7px + env(safe-area-inset-bottom));
}
.tabs-in{max-width:560px;margin:0 auto;display:flex;width:100%;gap:4px}
.tab{
  flex:1;border:0;background:transparent;border-radius:11px;padding:7px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-family:var(--font-d);color:var(--ink-soft);transition:.15s;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--violet);background:var(--surface-2)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(30,22,42,.52);display:grid;align-items:end;justify-items:center}
.scrim[hidden]{display:none!important}
.sheet{
  width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;
  box-shadow:var(--shadow-lift);padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh;max-height:92dvh;overflow-y:auto;animation:up .22s ease;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.fill{transition:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:16px;margin-bottom:3px;color:var(--violet)}
.sheet .sh-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-family:var(--font-d);color:var(--ink-soft);margin-bottom:6px}
.field input,.field textarea{
  width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:11px;padding:11px 12px;font-family:var(--font-b);font-size:16px;
}
.field textarea{resize:vertical;min-height:64px}
.field input:focus-visible,.field textarea:focus-visible,button:focus-visible,.chk:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:12.5px;font-family:var(--font-d);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.opt i{width:8px;height:8px;border-radius:50%;display:block}
.opt[aria-pressed="true"]{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent);color:var(--violet)}
.sheet-actions{display:flex;gap:9px;margin-top:18px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 0;font-family:var(--font-d);font-size:14px;font-weight:600}
.btn.primary{background:var(--grad);color:var(--on-violet);box-shadow:0 4px 16px color-mix(in srgb,var(--violet) 40%,transparent)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--c-imtihan);flex:0 0 auto;padding-inline:16px}

/* ---------- شريط التنبيهات ---------- */
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.alert{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  border-inline-start:4px solid var(--violet);text-align:start;width:100%;
}
.alert.late{border-inline-start-color:var(--c-imtihan)}
.alert.ev{border-inline-start-color:var(--c-nataij)}
.alert .n{
  flex-shrink:0;min-width:27px;height:27px;padding:0 7px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--on-violet);background:var(--violet);
}
.alert.late .n{background:var(--c-imtihan)}
.alert.ev .n{background:var(--c-nataij);font-size:14px}
.alert .tx{flex:1;min-width:0}
.alert .tx b{font-family:var(--font-d);font-weight:600;display:block;font-size:13.5px;line-height:1.45}
.alert .tx span{font-size:11.5px;color:var(--ink-soft);display:block;margin-top:1px}
.alert .go{flex-shrink:0;color:var(--ink-soft);line-height:0}

.tab{position:relative}
.tab .badge{
  position:absolute;inset-block-start:1px;inset-inline-end:calc(50% - 24px);
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--c-imtihan);
  color:var(--on-violet);font-size:10px;font-family:var(--font-d);font-weight:700;
  display:grid;place-items:center;line-height:1;
}
.pill.rep{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.pill.clash{background:color-mix(in srgb,var(--c-imtihan) 16%,transparent);color:var(--c-imtihan)}
.pill.hissa{background:var(--c-hissa);color:var(--on-hissa);font-weight:700}
.pill.standby{background:transparent;border:1px dashed var(--c-hissa);color:var(--c-hissa)}
.task .prog{

const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };

let tasks=[], SB=null, USER=null, outbox=[];
const LS="tarbawi_tasks_v1", LSK="tarbawi_killed_v1", LSQ="tarbawi_outbox_v1";

function setSync(cls,txt){
  const el=document.getElementById("sync");
  el.className="sync "+cls;

}
function loadLocal(){
  try{ tasks = JSON.parse(localStorage.getItem(LS)||"[]"); }catch(e){ tasks=[]; }
  try{ killed = new Set(JSON.parse(localStorage.getItem(LSK)||"[]")); }catch(e){ killed=new Set(); }
  try{ outbox = JSON.parse(localStorage.getItem(LSQ)||"[]"); }catch(e){ outbox=[]; }
  rebuildEvents();
}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(tasks)); }catch(e){} }
function saveKilledLocal(){ try{ localStorage.setItem(LSK, JSON.stringify([...killed])); }catch(e){} }
function saveOutbox(){ try{ localStorage.setItem(LSQ, JSON.stringify(outbox)); }catch(e){} }
function queue(op){ outbox.push(op); saveOutbox(); }

function stateLabel(){
  if(!SB) return ["local","على الجهاز"];
  if(!USER) return ["local","سجّل الدخول للمزامنة"];
  if(outbox.length) return ["wait","بانتظار الاتصال"];
  return ["ok","متزامن"];
}
function paintSync(){ const [c,t]=stateLabel(); setSync(c,t); }

const rowOf = t => ({
  id:t.id, user_id:USER.id, date:t.date, title:t.title, note:t.note||"",
  cat:t.cat, prio:t.prio, done:!!t.done, ts:t.ts,
  meta:{ rep:t.rep||{t:"none",d:[],until:""}, doneOn:t.doneOn||{}, skip:t.skip||[],
         cls:t.cls||"", period:t.period||0, standby:!!t.standby, progress:t.progress||{} }
});
const taskOf = r => {
  const m = r.meta || {};
  return { id:r.id, date:r.date, title:r.title, note:r.note||"", cat:r.cat, prio:r.prio,
           done:!!r.done, ts:Number(r.ts)||0,
           rep:m.rep||{t:"none",d:[],until:""}, doneOn:m.doneOn||{}, skip:m.skip||[],
           cls:m.cls||"", period:m.period||0, standby:!!m.standby, progress:m.progress||{} };
};

async function flush(){
  if(!SB||!USER) return false;
  while(outbox.length){
    const op = outbox[0];
    try{
      let r;
      if(op.k==="put")      r = await SB.from("tasks").upsert(rowOf(op.t));
      else if(op.k==="del") r = await SB.from("tasks").delete().eq("id",op.id).eq("user_id",USER.id);
      else                  r = await SB.from("removed_events").upsert({user_id:USER.id, ids:op.ids});
      if(r.error) throw r.error;
      outbox.shift(); saveOutbox();
    }catch(e){ paintSync(); return false; }
  }
  return true;
}
async function pull(){
  if(!SB||!USER) return;
  try{
    const r1 = await SB.from("tasks").select("*").eq("user_id",USER.id);
    if(r1.error) throw r1.error;
    tasks = (r1.data||[]).map(taskOf);
    saveLocal();
    const r2 = await SB.from("removed_events").select("ids").eq("user_id",USER.id).maybeSingle();
    if(!r2.error){ killed = new Set((r2.data&&r2.data.ids)||[]); saveKilledLocal(); rebuildEvents(); }
    paintSync(); render();
  }catch(e){ paintSync(); }
}
let syncing=false;
async function sync(){
  if(syncing||!SB||!USER) return;
  syncing=true;
  try{ if(await flush()) await pull(); }finally{ syncing=false; }
}

async function putTask(t){
  const i = tasks.findIndex(x=>x.id===t.id);
  if(i>=0) tasks[i]=t; else tasks.push(t);
  saveLocal(); render();
  queue({k:"put",t:Object.assign({},t)}); paintSync(); sync();
}
async function delTask(id){
  tasks = tasks.filter(x=>x.id!==id);
  saveLocal(); render();
  queue({k:"del",id}); paintSync(); sync();
}
async function pushKilled(){
  rebuildEvents(); saveKilledLocal(); render();
  outbox = outbox.filter(o=>o.k!=="killed");
  queue({k:"killed",ids:[...killed]}); paintSync(); sync();
}

/* ============ التكرار ============ */
const REPEATS = [
  {v:"none",   l:"بدون تكرار"},
  {v:"weekly", l:"أسبوعي"},
  {v:"school", l:"كل يوم دوام"},
  {v:"monthly",l:"شهري"}
];
const YEAR_START = "2026-09-06", YEAR_END = "2027-07-31";
const isRep = t => !!(t.rep && t.rep.t && t.rep.t !== "none");

function repLabel(t){
  if(!isRep(t)) return "";
  const r = t.rep;
  if(r.t==="weekly")  return "أسبوعي · " + (r.d||[]).slice().sort().map(i=>DAYS_S[i]).join("، ");
  if(r.t==="school")  return "كل يوم دوام";
  if(r.t==="monthly") return "شهري · يوم " + parse(t.date).getDate();
  return "";
}
function hits(t, ds){
  if(!isRep(t)) return t.date === ds;
  const r = t.rep;
  if(ds < t.date || ds > YEAR_END) return false;
  if(r.until && ds > r.until) return false;
  if((t.skip||[]).includes(ds)) return false;
  const d = parse(ds), dow = d.getDay();
  if(r.t==="weekly")  return (r.d||[]).includes(dow);
  if(r.t==="school")  return dow>=0 && dow<=4 && !HOLIDAY_DATES.has(ds);
  if(r.t==="monthly"){
    const anchor = parse(t.date).getDate();
    const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    return d.getDate() === Math.min(anchor, dim);
  }
  return false;
}
const occDone = (t, ds) => isRep(t) ? !!(t.doneOn||{})[ds] : !!t.done;
const occOf = (t, ds) => Object.assign({}, t, {date:ds, done:occDone(t,ds), _rep:isRep(t)});

const ord = t => isHissa(t) && t.period ? t.period : 99;
const isNisab = t => isHissa(t) && !t.standby;
function tasksOn(ds){
  return tasks.filter(t=>hits(t,ds)).map(t=>occOf(t,ds))
    .sort((a,b)=>(a.done-b.done)||(ord(a)-ord(b))
               ||(PRIOS.indexOf(a.prio)-PRIOS.indexOf(b.prio))||((a.ts||0)-(b.ts||0)));
}
/* حصتان في نفس اليوم بنفس الرقم */
function clashKeys(list){
  const seen = {}, bad = new Set();
  list.forEach(t=>{
    if(!isHissa(t) || !t.period) return;
    if(seen[t.period]){ bad.add(seen[t.period]); bad.add(t.id+"|"+t.date); }
    else seen[t.period] = t.id+"|"+t.date;
  });
  return bad;
}
function expand(from, to){
  const out = [];
  tasks.forEach(t=>{
    if(!isRep(t)){ out.push(occOf(t, t.date)); return; }
    const start = t.date > from ? t.date : from;
    const stop  = (t.rep.until && t.rep.until < to) ? t.rep.until : (to < YEAR_END ? to : YEAR_END);
    if(start > stop) return;
    for(let d = parse(start); key(d) <= stop; d = addDays(d,1)){
      const ds = key(d);
      if(hits(t, ds)) out.push(occOf(t, ds));
    }
  });
  return out;
}
const LATE_WINDOW = 21;
function lateList(){
  const from = key(addDays(new Date(), -LATE_WINDOW));
  return expand(from, TODAY).filter(t=>!t.done && t.date < TODAY);
}

function dotColors(ds){
  const cs=[];
  (evByDate[ds]||[]).forEach(e=>{ const c=CATS[e.c].color; if(!cs.includes(c)) cs.push(c); });
  if(tasksOn(ds).some(t=>!t.done)) cs.unshift("__mine__");
  return cs.slice(0,4);
}

  let html = alertsHtml() + monthNav();

    html += `<div class="wk" role="grid">`;

    const first = new Date(state.cur.y, state.cur.m, 1);
    const lead = first.getDay();
    const dim = new Date(state.cur.y, state.cur.m+1, 0).getDate();
    for(let i=0;i<lead;i++) html += `<div class="cell blank"></div>`;
    for(let d=1;d<=dim;d++){
      const ds = state.cur.y+"-"+pad(state.cur.m+1)+"-"+pad(d);
      const dow = new Date(state.cur.y,state.cur.m,d).getDay();
      const cls = ["cell"];

      if(HOLIDAY_DATES.has(ds)) cls.push("holiday");

        ${tks.length?`<div style="margin-top:4px">${(()=>{const ck=clashKeys(tks);return tks.map(t=>taskRow(t,ck)).join("")})()}</div>`:""}

function evRow(e, opts){
  const del = (opts&&opts.del&&e.id) ? `<button class="del" type="button" data-kill="${e.id}" aria-label="حذف الحدث نهائيًا">×</button>` : "";
  return `<div class="ev"><span class="stripe" style="background:${CATS[e.c].color}"></span>
    <span class="txt">${esc(e.t)}<span class="tag">${CATS[e.c].label}</span></span>${del}</div>`;
}
function taskRow(t, clashes){
  const late = !t.done && t.date < TODAY;
  const tc = TASK_CATS[t.cat] ? TASK_CATS[t.cat].color : "var(--ink-soft)";
  const hs = isHissa(t);
  const isClash = clashes && clashes.has(t.id+"|"+t.date);
  return `<div class="task${t.done?" done":""}">
    <button class="chk" type="button" role="checkbox" aria-checked="${t.done?"true":"false"}" data-toggle="${t.id}|${t.date}" aria-label="تبديل الإنجاز">✓</button>
    ${hs && t.period ? `<span class="pbadge num" aria-hidden="true">${t.period}</span>` : ""}
    <span class="body">
      <span class="ttl">${esc(t.title)}</span>
      ${t.note?`<span class="note">${esc(t.note)}</span>`:""}
      ${hs && progOn(t,t.date)?`<span class="prog">${esc(progOn(t,t.date))}</span>`:""}

/* ---------- حفظ ملف (يعمل في نسخة كلود وفي النسخة المستقلة) ---------- */
async function saveFile(filename, data, mime){
  try{
    const dl = (window.claude && claude.use) ? await claude.use("downloads") : null;
    if(dl){ await dl.save({filename, data}); return "ok"; }
  }catch(e){ if(e && e.code === "declined") return "declined"; }
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type:mime||"text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return "ok";
  }catch(e){ return "fail"; }
}

/* رسم الجدول على Canvas ثم تصديره PNG */
async function exportTimetable(){
  const sunday = weekSunday(state.sel);
  const grid = timetableData(sunday);
  const S = 2, W = 1000, colW = 176, rowH = 74, padX = 24, headH = 132;
  const H = headH + rowH*7 + 54;
  const cv = document.createElement("canvas");
  cv.width = W*S; cv.height = H*S;
  const x = cv.getContext("2d");
  x.scale(S,S);
  x.direction = "rtl"; x.textAlign = "center"; x.textBaseline = "middle";
  const F = (sz,w) => `${w||600} ${sz}px "Noto Kufi Arabic", sans-serif`;

  x.fillStyle = "#FBF7FF"; x.fillRect(0,0,W,H);
  const g = x.createLinearGradient(0,0,W,0);
  g.addColorStop(0,"#7B2FF7"); g.addColorStop(1,"#FF4D9D");
  x.fillStyle = g; x.fillRect(0,0,W,78);
  x.fillStyle = "#fff"; x.font = F(30,700);
  x.fillText("جدول الحصص الأسبوعي", W/2, 32);
  x.font = F(17,400);
  x.fillText("أسبوع " + longDate(key(sunday)), W/2, 60);

  const right = W - padX, colStart = right - 52;
  x.font = F(16,700); x.fillStyle = "#493463";
  SCHOOL_DAYS.forEach(i=>{
    const d = addDays(sunday,i);
    const cx = colStart - i*colW - colW/2;
    x.fillText(DAYS[d.getDay()] + " " + d.getDate(), cx, headH - 18);
  });

  for(let pr=1; pr<=7; pr++){
    const y = headH + (pr-1)*rowH;
    x.fillStyle = "#EEEAF2";
    x.beginPath(); x.roundRect(right-50, y+4, 46, rowH-8, 8); x.fill();
    x.fillStyle = "#7B2FF7"; x.font = F(19,700);
    x.fillText(String(pr), right-27, y+rowH/2);

    SCHOOL_DAYS.forEach(i=>{
      const list = grid[pr+"-"+i] || [];
      const cx = colStart - i*colW - colW/2;
      x.fillStyle = list.length ? "#E3E9F7" : "#F4F0FA";
      x.beginPath(); x.roundRect(cx-colW/2+4, y+4, colW-8, rowH-8, 8); x.fill();
      if(list.length){
        const lines = list.map(t=>(t.cls||"—") + (t.standby ? " (احتياط)" : ""));
        x.fillStyle = "#1E3A8A"; x.font = F(17,700);
        const start = y + rowH/2 - (lines.length-1)*11;
        lines.forEach((L,k)=> x.fillText(L, cx, start + k*22));
      }
    });
  }
  x.fillStyle = "#6E6285"; x.font = F(13,400);
  x.fillText("مهام التقويم التربوي — " + longDate(TODAY), W/2, H-26);

  const blob = await new Promise(r=>cv.toBlob(r,"image/png"));
  if(!blob){ return; }
  await saveFile("جدول-الحصص-" + key(sunday) + ".png", blob, "image/png");
}

/* ---------- تبويب المهام ---------- */
function renderTasks(){
  const FILTERS = [["all","الكل"],["today","اليوم"],["upcoming","قادمة"],["late","متأخرة"],["done","منجزة"]];
  const lateFrom = key(addDays(new Date(), -LATE_WINDOW));
  let list;
  if(state.filter==="today")         list = tasksOn(TODAY);
  else if(state.filter==="upcoming") list = expand(TODAY, YEAR_END).filter(t=>!t.done && t.date>TODAY);
  else if(state.filter==="late")     list = lateList();
  else if(state.filter==="done")     list = expand(lateFrom, YEAR_END).filter(t=>t.done);
  else                               list = expand(lateFrom, YEAR_END);
  if(state.catFilter!=="all") list=list.filter(t=>t.cat===state.catFilter);
  const q = (state.q||"").trim();
  if(q){
    const nq = q.toLowerCase();
    list = list.filter(t =>
      (t.title||"").toLowerCase().includes(nq) ||
      (t.note||"").toLowerCase().includes(nq) ||
      (t.cls||"").toLowerCase().includes(nq) ||
      (progOn(t,t.date)||"").toLowerCase().includes(nq));
  }
  list.sort((a,b)=> (a.done-b.done) || a.date.localeCompare(b.date) || (PRIOS.indexOf(a.prio)-PRIOS.indexOf(b.prio)));

  const groups={};
  list.forEach(t=>{ (groups[t.date] ||= []).push(t); });

  let html = alertsHtml() + `<div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="text" id="q" placeholder="ابحث في المهام والصفوف والمتابعة…" value="${esc(state.q||"")}" autocomplete="off">
  </div>
  <div class="chips" role="group" aria-label="تصفية حسب الحالة">
    ${FILTERS.map(([k,l])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${state.filter===k}">${l}</button>`).join("")}
  </div>
  <div class="chips" role="group" aria-label="تصفية حسب التصنيف">
    <button class="chip" type="button" data-cf="all" aria-pressed="${state.catFilter==="all"}">كل التصنيفات</button>
    ${Object.entries(TASK_CATS).map(([k,c])=>`<button class="chip" type="button" data-cf="${k}" aria-pressed="${state.catFilter===k}"><i style="background:${c.color}"></i>${c.label}</button>`).join("")}
  </div>`;

  const keys = Object.keys(groups);
  if(!keys.length){
    html += `<div class="card"><p class="empty">لا توجد مهام ضمن هذه التصفية.<br>افتح التقويم واختر يومًا ثم اضغط «+ مهمة».</p></div>`;
  }else{
    keys.forEach(d=>{
      html += `<div class="card"><h3 style="display:flex;justify-content:space-between;gap:8px">
        <span>${longDate(d)}</span>
        <span style="font-size:11.5px;color:var(--ink-soft);font-weight:400">${(evByDate[d]||[]).length?`${(evByDate[d]||[]).length} حدث رسمي`:""}</span></h3>
        ${(()=>{const ck=clashKeys(groups[d]);return groups[d].map(t=>taskRow(t,ck)).join("")})()}</div>`;
    });
  }
  const nRep = tasks.filter(isRep).length;
  html += `<p class="hint">بنود مسجَّلة: <b class="num">${tasks.length}</b>${nRep?` — منها <b class="num">${nRep}</b> متكرّرة`:""}<br>
    القائمة تعرض من ${longDate(lateFrom)} حتى نهاية العام الدراسي.</p>`;
  main.innerHTML = html;
  const qi = document.getElementById("q");
  if(qi){
    qi.oninput = ()=>{
      state.q = qi.value;
      clearTimeout(_qTimer);
      _qTimer = setTimeout(()=>{
        const p0 = qi.selectionStart, act = document.activeElement === qi;
        render();
        const q2 = document.getElementById("q");
        if(q2 && act){ q2.focus({preventScroll:true}); try{ q2.setSelectionRange(p0,p0); }catch(e){} }
      }, 220);
    };
  }
  main.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ state.filter=b.dataset.f; render(); });
  main.querySelectorAll("[data-cf]").forEach(b=>b.onclick=()=>{ state.catFilter=b.dataset.cf; render(); });
  wireCommon();
}

/* ---------- تبويب الإحصائيات ---------- */
function renderStats(){
  const winFrom = key(addDays(new Date(),-30)), winTo = key(addDays(new Date(),30));
  const win = expand(winFrom, winTo).filter(t=>t.date>=winFrom && t.date<=winTo);
  const total=win.length, done=win.filter(t=>t.done).length;
  const late=lateList().length;
  const soon=win.filter(t=>!t.done&&t.date>=TODAY&&t.date<=key(addDays(new Date(),7))).length;
  const pct = total? Math.round(done/total*100) : 0;
  const R=34, C=2*Math.PI*R;

  const byCat = Object.entries(TASK_CATS).map(([k,c])=>{
    const all=win.filter(t=>t.cat===k);
    return {k,label:c.label,color:c.color,n:all.length,d:all.filter(t=>t.done).length};
  }).filter(x=>x.n>0);
  const maxN = Math.max(1,...byCat.map(x=>x.n));

  const live = liveEvents();
  const evCounts = Object.entries(CATS).map(([k,c])=>({label:c.label,color:c.color,n:live.filter(e=>e[2]===k).length}));
  const maxE = Math.max(1,...evCounts.map(x=>x.n));

  const next = live.filter(e=>e[0]>=TODAY).sort((a,b)=>a[0].localeCompare(b[0])).slice(0,4);

  let html = `<div class="tiles">
    <div class="tile"><div class="v num">${total}</div><div class="k">مهام خلال ٣٠ يومًا حولك</div></div>
    <div class="tile"><div class="v num" style="color:var(--c-otla)">${done}</div><div class="k">مهام منجزة</div></div>
    <div class="tile"><div class="v num" style="color:var(--c-imtihan)">${late}</div><div class="k">متأخرة عن موعدها</div></div>
    <div class="tile"><div class="v num" style="color:var(--c-tasjeel)">${soon}</div><div class="k">خلال ٧ أيام</div></div>
  </div>

  <div class="card"><div class="ring">
    <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="var(--violet)"/><stop offset="100%" stop-color="var(--rose)"/>
      </linearGradient></defs>
      <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
      <circle cx="42" cy="42" r="${R}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 42 42)"/>
    </svg>
    <div><div class="rt num">${pct}%</div><div class="rs">الإنجاز خلال ٣٠ يومًا حولك<br>${done} منجزة من ${total} مهمة</div></div>
  </div></div>`;

  html += `<div class="card"><h3>مهامي حسب التصنيف <span style="font-size:11px;color:var(--ink-soft);font-weight:400">(٣٠ يومًا حولك)</span></h3>`;
  if(byCat.length){
    byCat.forEach(x=>{
      html += `<div class="bar"><div class="l"><span>${x.label}</span><b class="num">${x.d} / ${x.n}</b></div>
        <div class="track"><div class="fill" style="width:${Math.round(x.n/maxN*100)}%;background:${x.color}"></div></div></div>`;
    });
  }else{
    html += `<p class="empty" style="padding:4px 0">لم تُسجَّل مهام بعد.</p>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>محطات التقويم التربوي هذا العام</h3>`;
  evCounts.filter(x=>x.n>0).forEach(x=>{
    html += `<div class="bar"><div class="l"><span>${x.label}</span><b class="num">${x.n}</b></div>
      <div class="track"><div class="fill" style="width:${Math.round(x.n/maxE*100)}%;background:${x.color}"></div></div></div>`;
  });
  html += `</div>`;

  /* ---- الحصص المدرسية ---- */
  const now = new Date(), sun = addDays(now, -now.getDay());
  const wk = expand(key(sun), key(addDays(sun,6))).filter(isHissa);
  const byCls = {};
  wk.forEach(t=>{ const k = t.cls || "بدون صف"; byCls[k] = (byCls[k]||0)+1; });
  const clsRows = Object.entries(byCls).sort((a,b)=>b[1]-a[1]);
  const maxC = Math.max(1, ...clsRows.map(x=>x[1]));

  html += `<div class="card"><h3>الحصص المدرسية <span style="font-size:11px;color:var(--ink-soft);font-weight:400">(هذا الأسبوع)</span></h3>`;
  if(wk.length){
    const sbN = wk.filter(t=>t.standby).length;
    html += `<div class="nextline" style="border:0;padding:0 0 10px">
      <b class="num">${wk.length-sbN}</b> حصة نصاب · منجز منها <b class="num">${wk.filter(t=>t.done&&!t.standby).length}</b>
      ${sbN?`<br><b class="num">${sbN}</b> حصة احتياط`:""}</div>`;
    clsRows.forEach(([k,n])=>{
      html += `<div class="bar"><div class="l"><span>${esc(k)}</span><b class="num">${n}</b></div>
        <div class="track"><div class="fill" style="width:${Math.round(n/maxC*100)}%;background:var(--c-hissa)"></div></div></div>`;
    });
  }else{
    html += `<p class="empty" style="padding:4px 0">لم تُسجَّل حصص هذا الأسبوع.<br>أضف مهمة بتصنيف «حصة» وحدّد الصف ورقم الحصة.</p>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>القادم في التقويم</h3>`;
  if(next.length){
    next.forEach(([d,t,c])=>{
      const days = Math.round((parse(d)-parse(TODAY))/86400000);
      html += `<div class="ev"><span class="stripe" style="background:${CATS[c].color}"></span>
        <span class="txt">${esc(t)}<span class="tag">${longDate(d)} · ${days===0?"اليوم":days===1?"غدًا":`بعد ${days} يومًا`}</span></span></div>`;
    });
  }else{
    html += `<p class="empty" style="padding:4px 0">انتهت محطات هذا العام الدراسي.</p>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>نسخة احتياطية</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.7">
      ملف واحد يحفظ كل مهامك وأحداث التقويم المحذوفة. احتفظ به مرة كل فصل دراسي.</p>
    <div class="rowbtns">
      <button class="ttbtn" type="button" id="bk-out">⬇ تصدير نسخة</button>
      <button class="ttbtn" type="button" id="bk-in">⬆ استيراد نسخة</button>
    </div>
    <input type="file" id="bk-file" accept="application/json,.json" hidden>
  </div>

  <div class="card"><h3>أحداث التقويم المحذوفة</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.7">
      حذفتَ <b class="num">${killed.size}</b> من أصل <b class="num">${EVENTS.length}</b> حدثًا رسميًا.
      إعادة الضبط تُرجع كل الأحداث المحذوفة دفعة واحدة ولا تمسّ مهامك.
    </p>
    <button class="btn ghost" id="resetev" type="button" ${killed.size?"":"disabled style=opacity:.45"}>إعادة ضبط أحداث التقويم</button>
  </div>`;

  main.innerHTML = html;
  wireCommon();

  const bo = document.getElementById("bk-out");
  if(bo) bo.onclick = async ()=>{
    const payload = JSON.stringify({app:"tarbawi", v:1, at:new Date().toISOString(),
      tasks, killed:[...killed]}, null, 2);
    bo.textContent = "جارٍ التجهيز…";
    await saveFile("نسخة-احتياطية-" + TODAY + ".json", payload, "application/json");
    bo.textContent = "⬇ تصدير نسخة";
  };
  const bi = document.getElementById("bk-in"), bf = document.getElementById("bk-file");
  if(bi && bf){
    bi.onclick = ()=>bf.click();
    bf.onchange = ()=>{
      const f = bf.files && bf.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        let data;
        try{ data = JSON.parse(r.result); }catch(e){ data = null; }
        bf.value = "";
        if(!data || !Array.isArray(data.tasks)){
          askConfirm({title:"ملف غير صالح", text:"تعذّرت قراءة الملف — تأكد أنه ملف نسخة احتياطية من هذا التطبيق.", ok:"حسنًا", run:()=>{}});
          return;
        }
        askConfirm({
          title:"استيراد نسخة احتياطية",
          text:"ستُدمج مهام الملف مع مهامك الحالية. المهمة التي لها نفس المعرّف تُستبدل بنسخة الملف.",
          what:`${data.tasks.length} مهمة · ${(data.killed||[]).length} حدث محذوف`,
          ok:"استيراد ودمج",
          run: async ()=>{
            const byId = {}; tasks.forEach(t=>byId[t.id]=t);
            data.tasks.forEach(t=>{ if(t && t.id) byId[t.id]=t; });
            const merged = Object.values(byId);
            for(const t of merged) await putTask(t);
            if(Array.isArray(data.killed)){
              killed = new Set([...killed, ...data.killed]);
              await pushKilled();
            }
            render();
          }
        });
      };
      r.readAsText(f);
    };
  }

  const rb = document.getElementById("resetev");
  if(rb && killed.size) rb.onclick = ()=>askConfirm({
    title:"إعادة ضبط أحداث التقويم",
    text:`سيُعاد إدراج ${killed.size} حدثًا محذوفًا إلى التقويم على كل أجهزتك. مهامك المسجَّلة لن تتأثر.`,
    what:"", ok:"إعادة الضبط",
    run: async ()=>{ killed = new Set(); await pushKilled(); }
  });
}

/* ============ نافذة التأكيد ============ */
const cscrim=document.getElementById("cscrim");
let pendingRun=null;
let pendingRun2=null;
function askConfirm(o){
  document.getElementById("ctitle").textContent=o.title;
  document.getElementById("ctext").textContent=o.text;
  const w=document.getElementById("cwhat");
  w.textContent=o.what||""; w.hidden=!o.what;
  document.getElementById("c-ok").textContent=o.ok||"حذف نهائي";
  const b2=document.getElementById("c-ok2");
  b2.hidden=!o.ok2; if(o.ok2) b2.textContent=o.ok2;
  pendingRun=o.run; pendingRun2=o.run2||null;
  cscrim.hidden=false;
}
function closeConfirm(){ cscrim.hidden=true; pendingRun=null; pendingRun2=null; }
document.getElementById("c-no").onclick=closeConfirm;
cscrim.onclick=e=>{ if(e.target===cscrim) closeConfirm(); };
document.getElementById("c-ok").onclick=async ()=>{
  const run=pendingRun; closeConfirm(); if(run) await run();
};
document.getElementById("c-ok2").onclick=async ()=>{
  const run=pendingRun2; closeConfirm(); if(run) await run();
};

/* ============ نافذة المهمة ============ */
const scrim=document.getElementById("scrim"), sheet=document.getElementById("sheet");
let draft={cat:"tahdeer",prio:"متوسطة",period:0,standby:false,rep:{t:"none",d:[],until:""}};

function optButtons(el, items, cur, cb){
  el.innerHTML = items.map(it=>`<button class="opt" type="button" data-v="${it.v}" aria-pressed="${it.v===cur}">${it.dot?`<i style="background:${it.dot}"></i>`:""}${it.l}</button>`).join("");
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ cb(b.dataset.v); });
}
function paintOpts(){
  optButtons(document.getElementById("f-cat"),
    Object.entries(TASK_CATS).map(([k,c])=>({v:k,l:c.label,dot:c.color})), draft.cat,
    v=>{ draft.cat=v; paintOpts(); });

  const hb = document.getElementById("f-hissa-box");
  hb.hidden = draft.cat !== "hissa";
  if(!hb.hidden){
    const pbox = document.getElementById("f-period");
    pbox.innerHTML = PERIODS.map((l,i)=>
      `<button class="opt" type="button" data-p="${i+1}" aria-pressed="${draft.period===i+1}">${i+1}</button>`).join("");
    pbox.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
      const n=+b.dataset.p; draft.period = draft.period===n ? 0 : n; paintOpts();
    });
    const names = [...new Set(tasks.filter(isHissa).map(t=>t.cls).filter(Boolean).concat(CLASS_SEED))];
    document.getElementById("classlist").innerHTML = names.map(n=>`<option value="${esc(n)}"></option>`).join("");
    const sb = document.getElementById("f-standby");
    sb.innerHTML = `<button class="opt" type="button" id="sb-btn" aria-pressed="${draft.standby}">حصة احتياط</button>`;
    document.getElementById("sb-btn").onclick = ()=>{ draft.standby = !draft.standby; paintOpts(); };
  }
  optButtons(document.getElementById("f-prio"),
    PRIOS.map(p=>({v:p,l:p})), draft.prio,
    v=>{ draft.prio=v; paintOpts(); });
  optButtons(document.getElementById("f-rep"),
    REPEATS.map(r=>({v:r.v,l:r.l})), draft.rep.t,
    v=>{
      draft.rep.t = v;
      if(v==="weekly" && !draft.rep.d.length){
        const ds = document.getElementById("f-date").value || state.sel;
        draft.rep.d = [parse(ds).getDay()];
      }
      paintOpts();
    });

  const dayBox = document.getElementById("f-rep-days");
  dayBox.hidden = draft.rep.t !== "weekly";
  if(!dayBox.hidden){
    dayBox.innerHTML = DAYS_S.map((d,i)=>
      `<button class="opt" type="button" data-d="${i}" aria-pressed="${draft.rep.d.includes(i)}">${d}</button>`).join("");
    dayBox.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
      const i = +b.dataset.d;
      draft.rep.d = draft.rep.d.includes(i) ? draft.rep.d.filter(x=>x!==i) : draft.rep.d.concat(i);
      paintOpts();
    });
  }
  const untilBox = document.getElementById("f-rep-until");
  untilBox.hidden = draft.rep.t === "none";
  document.getElementById("f-until").value = draft.rep.until || "";
}
function openSheet(task, date, occDate){
  state.editing = task ? task.id : null;
  state.occDate = occDate || (task ? task.date : null);
  draft = {
    cat:  task ? (task.cat||"tahdeer") : "tahdeer",
    prio: task ? (task.prio||"متوسطة") : "متوسطة",
    period: task ? (task.period||0) : 0,
    standby: task ? !!task.standby : false,
    rep:  task && task.rep ? {t:task.rep.t||"none", d:(task.rep.d||[]).slice(), until:task.rep.until||""}
                           : {t:"none", d:[], until:""}
  };
  const ds = task ? task.date : (date||state.sel);
  const repeating = task && isRep(task);
  document.getElementById("sheettitle").textContent = task ? (repeating ? "تعديل المهمة المتكرّرة" : "تعديل المهمة") : "مهمة جديدة";
  document.getElementById("sheetsub").textContent = repeating
    ? `يبدأ من ${longDate(ds)} · ${repLabel(task)} — التعديل يسري على كل المواعيد`
    : longDate(ds) + ((evByDate[ds]||[]).length? ` · ${(evByDate[ds]||[]).length} حدث رسمي في هذا اليوم` : "");
  document.getElementById("f-title").value = task? task.title : "";
  document.getElementById("f-note").value  = task? (task.note||"") : "";
  document.getElementById("f-class").value = task? (task.cls||"") : "";
  const pb = document.getElementById("f-prog-box");
  const showProg = !!(task && isHissa(task) && occDate);
  pb.hidden = !showProg;
  if(showProg){
    document.querySelector('label[for="f-prog"]').textContent = "ما أُنجز في " + longDate(occDate);
    document.getElementById("f-prog").value = progOn(task, occDate);
  }
  document.getElementById("f-date").value  = ds;
  document.getElementById("f-del").hidden  = !task;
  document.querySelector('label[for="f-date"]').textContent = repeating ? "تاريخ بداية التكرار" : "التاريخ";
  paintOpts();
  scrim.hidden = false;
  setTimeout(()=>document.getElementById("f-title").focus(),50);
}
function closeSheet(){ scrim.hidden = true; state.editing=null; }

document.getElementById("f-cancel").onclick = closeSheet;
scrim.onclick = e => { if(e.target===scrim) closeSheet(); };
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(!cscrim.hidden) closeConfirm();
  else if(!scrim.hidden) closeSheet();
});

document.getElementById("f-save").onclick = async ()=>{
  const title = document.getElementById("f-title").value.trim();
  const date  = document.getElementById("f-date").value;
  if(!title){ document.getElementById("f-title").focus(); return; }
  if(!date){ document.getElementById("f-date").focus(); return; }
  const old = state.editing ? tasks.find(t=>t.id===state.editing) : null;
  const until = document.getElementById("f-until").value || "";
  let rep = {t:"none", d:[], until:""};
  if(draft.rep.t !== "none"){
    let days = draft.rep.d.slice();
    if(draft.rep.t==="weekly" && !days.length) days = [parse(date).getDay()];
    rep = {t:draft.rep.t, d:days, until};
  }
  const t = {
    id: old? old.id : "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date, title, note: document.getElementById("f-note").value.trim(),
    cat: draft.cat, prio: draft.prio,
    cls:     draft.cat==="hissa" ? document.getElementById("f-class").value.trim() : "",
    period:  draft.cat==="hissa" ? (draft.period||0) : 0,
    standby: draft.cat==="hissa" ? !!draft.standby : false,
    progress: (()=>{
      const m = Object.assign({}, (old && old.progress) || {});
      const pb2 = document.getElementById("f-prog-box");
      if(!pb2.hidden && state.occDate){
        const v = document.getElementById("f-prog").value.trim();
        if(v) m[state.occDate] = v; else delete m[state.occDate];
      }
      return draft.cat==="hissa" ? m : {};
    })(),
    done: (old && rep.t==="none") ? !!old.done : false,
    rep,
    doneOn: rep.t==="none" ? {} : (old && old.doneOn ? old.doneOn : {}),
    skip:   rep.t==="none" ? [] : (old && old.skip   ? old.skip   : []),
    ts: old? (old.ts||Date.now()) : Date.now()
  };
  state.sel = date;
  const d = parse(date); state.cur = {y:d.getFullYear(), m:d.getMonth()};
  closeSheet();
  await putTask(t);
};
document.getElementById("f-del").onclick = ()=>{
  const id = state.editing, ds = state.occDate;
  const t = tasks.find(x=>x.id===id);
  closeSheet();
  if(!t) return;
  if(isRep(t)){
    askConfirm({
      title:"حذف مهمة متكرّرة",
      text:"هذه المهمة تتكرّر. اختر ما تريد حذفه — لا يمكن التراجع.",
      what:t.title+" — موعد " + longDate(ds),
      ok:"حذف السلسلة كلها",
      ok2:"حذف موعد " + longDate(ds) + " فقط",
      run:  async ()=>{ await delTask(id); },
      run2: async ()=>{
        const skip = (t.skip||[]).concat(ds);
        await putTask(Object.assign({}, t, {skip}));
      }
    });
    return;
  }
  askConfirm({
    title:"حذف المهمة",
    text:"سيُحذف هذا البند نهائيًا من مهامك.",
    what:t.title+" — "+longDate(t.date),
    ok:"حذف نهائي",
    run: async ()=>{ await delTask(id); }
  });
};

/* ============ التبويبات والوضع الليلي ============ */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; _noScrollKeep=true; render(); window.scrollTo(0,0); });
document.getElementById("themebtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
  try{ localStorage.setItem("tarbawi_theme", dark?"light":"dark"); }catch(e){}
};
try{ const th=localStorage.getItem("tarbawi_theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}

render();
window.addEventListener("load", ()=>{
  initStore();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
});
</script>
